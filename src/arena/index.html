function renderSigNoise(r,host){
  const node=host.querySelector(".signoise"); if(!node)return; node.innerHTML="";
  const cond=state[r.key], models=modelsOf(r), COLOR=colorMap(r);
  const dims=dimsByTier(r); if(!dims.length||!models.length)return;
  // σ = the control noise floor's bootstrap RATE sd (sweep_stats), NOT popsd of
  // individual control samples (that's the per-sample sd ~sqrt(p(1-p)), ~7x too
  // big, and made every real effect vanish). Fall back to popsd if stats absent.
  const fl=(r.significance&&r.significance.floor)||{};
  const floorSd=m=>{const f=fl[m+""+cond]; return (f&&f.sd>0)?f.sd:null;};
  const noise={};models.forEach(m=>noise[m]=floorSd(m)??popsd(pooledRuns(r,cond,m,d=>d.tier===-1)));
  // strongest verdict among a dimension's dose-cells for one model (cells judged
  // per-dose in sweep_stats; the panel pools doses, so surface the best).
  const VRANK={signal:3,tentative:2,noise:1,underpowered:0};
  const dimVerdict=(dim,m)=>{let best=null,br=-1;r.records.forEach(d=>{
    if(d.condition===cond&&d.model===m&&d.dimension===dim&&d.sig){
      const k=VRANK[d.sig.verdict]; if(k>br){br=k;best=d.sig.verdict;}}});return best;};
  let lo=-2,hi=2;
  const z=(dim,m)=>{const n=noise[m]; if(!(n>0))return null;
    const d=dimDelta(r,cond,m,dim); if(!d)return null;
    const v=d.dv/n; lo=Math.min(lo,v);hi=Math.max(hi,v); return v;};
  const data={};dims.forEach(c=>data[c]=models.map(m=>z(c,m)));
  const mag=c=>{const xs=data[c].filter(v=>v!=null).map(Math.abs);return xs.length?mean(xs):-1;};
  const ranked=[...dims].sort((a,b)=>mag(b)-mag(a));
  lo=Math.floor(lo)-1;hi=Math.ceil(hi)+1;
  const nB=models.length,W=Math.max(560,ranked.length*(nB*24+40))+70,H=360;
  const left=58,right=14,top=18,bottom=82,plotW=W-left-right,plotH=H-top-bottom;
  const yOf=v=>top+plotH*(1-(v-lo)/(hi-lo));
  const svg=el("svg",{width:W,height:H,viewBox:"0 0 "+W+" "+H});
  svg.appendChild(el("rect",{x:left,y:yOf(2),width:plotW,height:Math.max(0,yOf(-2)-yOf(2)),
    fill:"#9aa3b2","fill-opacity":0.10}));
  const gridStart=Math.ceil(lo/4)*4,gridEnd=Math.floor(hi/4)*4;
  for(let v=gridStart;v<=gridEnd;v+=4){
    const y=yOf(v), major=(v===0||Math.abs(v)===2);
    svg.appendChild(el("line",{x1:left,y1:y,x2:W-right,y2:y,
      stroke:v===0?"#566":"#2b3040",
      "stroke-opacity":v===0?1:0.55,"stroke-dasharray":v===0?"":"4 3"}));
    txt(svg,left-8,y+4,(v>0?"+":"")+v+"σ","end",v===0?"#9aa3b2":"#6b7280",9.5);}
  txt(svg,16,top+plotH/2,"effect vs control (σ of noise floor)","middle","#9aa3b2",10,-90);
  // opacity by verdict (sweep_stats), falling back to |z|>=2 when stats absent.
  const VOP={signal:0.95,tentative:0.7,noise:0.32,underpowered:0.18};
  const groupW=plotW/ranked.length,barW=(groupW*0.7)/nB,padg=groupW*0.15,y0=yOf(0);
  ranked.forEach((c,gi)=>{models.forEach((m,mi)=>{const v=data[c][mi];
    if(v==null)return;const x=left+gi*groupW+padg+mi*barW;
    const yt=Math.min(y0,yOf(v)),h=Math.abs(yOf(v)-y0);
    const vd=dimVerdict(c,m), op=(vd!=null?VOP[vd]:(Math.abs(v)>=2?0.95:0.4));
    svg.appendChild(el("rect",{x:x+1,y:yt,width:Math.max(1,barW-2),height:Math.max(1,h),
      fill:COLOR[m],"fill-opacity":op,
      stroke:vd==="signal"?"#e6e8ee":"none","stroke-width":vd==="signal"?1.2:0}));
    txt(svg,x+barW/2,(v>=0?yt-3:yt+h+10),(v>0?"+":"")+v.toFixed(1),"middle","#cfd3dd",8.5);});
    const gx=left+gi*groupW+groupW/2;
    txt(svg,gx,top+plotH+18,c,"middle","#e6e8ee",10.5);
    txt(svg,gx,top+plotH+32,"("+(TIERS[(r.records.find(d=>d.dimension===c)||{}).tier]||"?")+")","middle","#9aa3b2",9);
    txt(svg,gx,top+plotH+48,"#"+(gi+1),"middle","#7aa2ff",9.5);});
  node.appendChild(svg);
  // verdict tally + legend (clustering + BH-FDR honest)
  const vc=(r.significance&&r.significance.verdicts)||{};
  const order=["signal","tentative","noise","underpowered"];
  if(order.some(k=>vc[k])){
    const cap=el("div",{class:"subtle",style:"margin-top:6px;font-size:11px"});
    cap.innerHTML="cells: "+order.filter(k=>vc[k]).map(k=>
      '<b style="opacity:'+VOP[k]+'">'+k+"</b> "+vc[k]).join(" &middot; ")+
      " &mdash; <i>signal</i>=CI excludes 0 &amp; survives BH-FDR; <i>tentative</i>=CI excludes 0, fails FDR; "+
      "<i>noise</i>/<i>underpowered</i>=CI covers 0. σ = bootstrap control-rate sd.";
    node.appendChild(cap);
  }
  modelLegendFor(node,r);
}

function renderSlope(r,host){

    if(s.mean!=null){lo=Math.min(lo,s.mean);hi=Math.max(hi,s.mean);}return s.mean;});});
  if(hi<lo){lo=0;hi=100;}if(hi-lo<1){hi+=5;lo-=5;}

    if(pts.length<2)return;let path="";pts.forEach((p,i)=>path+=(i?" L":"M")+p.x+" "+p.y);

function renderViolin(r,host){

    .filter(s=>s.vals.length>=5);

      stroke:"#fff","stroke-opacity":0.85,"stroke-width":1.4}));

  node.appendChild(svg);

function renderPole(r,host){
  const node=host.querySelector(".polechart"); if(!node)return; node.innerHTML="";
  const cond=state[r.key], m=protoModel(r); if(!m)return;
  const dims=dimsByTier(r).filter(dim=>r.records.some(d=>d.dimension===dim&&d.dose<0));
  if(!dims.length){node.innerHTML='<p class="subtle">No signed-axis (bidirectional) dimensions in this eval.</p>';return;}
  const base=stat(pooledRuns(r,cond,m,d=>d.tier===-1));
  const eff=(dim,neg)=>{const s=stat(pooledRuns(r,cond,m,
      d=>d.dimension===dim&&(neg?d.dose<0:d.dose>0)));
    return (s.mean==null||base.mean==null)?null:{dv:s.mean-base.mean,se:s.se};};
  const data=dims.map(dim=>({dim:dim,neg:eff(dim,true),pos:eff(dim,false)}));
  let lo=0,hi=0;data.forEach(d=>[d.neg,d.pos].forEach(o=>{if(o){lo=Math.min(lo,o.dv);hi=Math.max(hi,o.dv);}}));
  if(hi-lo<1){hi+=5;lo-=5;}const pad=(hi-lo)*0.12;hi+=pad;lo-=pad;
  const W=Math.max(480,dims.length*120)+60,H=300;

  const svg=el("svg",{width:W,height:H,viewBox:"0 0 "+W+" "+H});
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=yOf(v);
    svg.appendChild(el("line",{x1:left,y1:y,x2:W-right,y2:y,stroke:"#2b3040"}));
    txt(svg,left-8,y+4,(v>0?"+":"")+v.toFixed(0),"end","#9aa3b2",10);}
  const y0=yOf(0);svg.appendChild(el("line",{x1:left,y1:y0,x2:W-right,y2:y0,stroke:"#566"}));
  txt(svg,16,top+plotH/2,"Δ "+r.metric_label+" vs control","middle","#9aa3b2",10,-90);
  txt(svg,left+plotW/2,top-6,m,"middle","#e6e8ee",11);
  const groupW=plotW/dims.length,barW=groupW*0.26,gap=groupW*0.06;
  const NEG="#7aa2ff",POS="#f2a65a";
  data.forEach((d,gi)=>{const gx=left+gi*groupW+groupW/2;
    [[d.neg,-1,NEG],[d.pos,1,POS]].forEach(([o,side,col])=>{if(!o)return;
      const x=gx+side*gap+(side<0?-barW:0);
      const yt=Math.min(y0,yOf(o.dv)),h=Math.abs(yOf(o.dv)-y0);
      svg.appendChild(el("rect",{x:x,y:yt,width:barW,height:Math.max(1,h),fill:col,"fill-opacity":0.9}));
      txt(svg,x+barW/2,(o.dv>=0?yt-3:yt+h+10),(o.dv>0?"+":"")+o.dv.toFixed(0),"middle","#cfd3dd",8.5);});
    txt(svg,gx,top+plotH+18,d.dim,"middle","#e6e8ee",10.5);});
  txt(svg,left+8,top+10,"■ − pole","start",NEG,10);txt(svg,left+78,top+10,"■ + pole","start",POS,10);
  node.appendChild(svg);
}

    '&mdash; spread per tier / control spread</div>'+
    '<p class="subtle">Each cell = '+r.metric_label+' spread (max&minus;min of bar means) the '+
    'tier&rsquo;s perturbations introduce, divided by that model&rsquo;s control per-run spread.</p>'+

    '<b>bootstrap control-rate σ</b> (resampled over items), not the per-sample spread. Bars are '+
    'shaded by the clustering- and FDR-honest verdict from <code>sweep_stats</code> '+
    '(solid+outlined = <i>signal</i>, survives BH-FDR; faded = <i>noise/underpowered</i>); the '+
    '±2σ band is the rough jitter floor. Counts and definitions are under the chart.</p>'+
    '<div class="chart"><div class="signoise"></div></div><div class="legend"></div>'+
    '<div class="sech" style="font-size:13.5px;margin-top:18px">3 &middot; Cross-model fingerprint '+
    '&mdash; final percent slope chart</div>'+
    '<p class="subtle">Final '+r.metric_label+' per dimension, one line per model. A rising curve '+
    'from early tiers to later tiers means stronger perturbation classes move the final metric upward.</p>'+
    '<div class="chart"><div class="slopechart"></div></div><div class="legend"></div>'+
    '<div class="sech" style="font-size:13.5px;margin-top:18px">5 &middot; Per-run distribution '+
    '&mdash; violins</div>'+
    '<p class="subtle">Pooled per-run scores per dimension (selected model). Bimodal shapes = a '+
    'class that <i>flips</i> some runs rather than nudging them all &mdash; hidden by the mean. '+
    'White tick = mean; grey = control.</p>'+
    '<div class="chart"><div class="violinchart"></div></div>'+
    '<div class="sech" style="font-size:13.5px;margin-top:18px">6 &middot; Pole asymmetry '+
    '&mdash; signed-axis dimensions</div>'+
    '<p class="subtle">For each bidirectional axis, the two poles&rsquo; effect vs control. '+
    'Mirror-image bars = symmetric; lopsided = one pole moves behaviour more.</p>'+
    '<div class="chart"><div class="polechart"></div></div>';
  // requested order: bar chart, prompt variations, category sensitivity, dose-response, prototypes
  const charts=has?(ctrl+chart1Block+variationBlock+catBlock+doseBlock+protoBlock)
    :'<p class="empty">No results yet — run this eval, then regenerate this page.</p>';
  const topTable=r.summary
    ?('<div class="controls"><label><input type="checkbox" class="dp-toggle"> '+
      'show 1 decimal place</label></div><div class="hontable">'+honestyTable(r,0)+'</div>')
    :summaryTable(r);
  page.innerHTML='<h2>'+r.title+'</h2><p class="sub">'+r.blurb+'</p>'+
    modelCtrl+topTable+spreadNote(r)+charts;
  // hover a bar/point/legend-square -> highlight that model's swatch in the legend.
  // closest() resolves the data-model from a hovered sub-element (e.g. the legend <i>
  // square, or a bar's child) so the whole shape is hoverable, not just its exact node.
  page.addEventListener("mouseover",e=>{const t=e.target&&e.target.closest&&e.target.closest("[data-model]");if(t)setLegendHi(page,t.getAttribute("data-model"),true);});
  page.addEventListener("mouseout", e=>{const t=e.target&&e.target.closest&&e.target.closest("[data-model]");if(t)setLegendHi(page,t.getAttribute("data-model"),false);});
  if(has)setTimeout(()=>{
    if(r.axes)renderAxisGap(r,page); else renderChart(r,page);
    renderCategoryChart(r,page);renderDoseCurves(r,page);
    renderDoseResponse(r,page);renderVariation(r,page);renderProto(r,page);
    fillModelLegend(page.querySelector(".modelsel"),r,null);   // populate the sticky model selector
    page.querySelectorAll('input[name="axsc-'+r.key+'"]').forEach(rb=>
      rb.addEventListener("change",()=>{if(rb.checked){axisScope[r.key]=rb.value;
        renderAxisGap(r,page);}}));
    const ms=page.querySelector(".metric-sel");
    if(ms)ms.addEventListener("change",()=>{metricState[r.key]=ms.value;renderChart(r,page);});
    const dcm=page.querySelector(".dosecurve-metric");
    if(dcm)dcm.addEventListener("change",()=>{doseCurveMetric[r.key]=dcm.value;renderDoseCurves(r,page);});
    const dcmod=page.querySelector(".dosecat-model");
    if(dcmod)dcmod.addEventListener("change",()=>{doseCatModel[r.key]=dcmod.value;
      renderDoseResponse(r,page);renderProto(r,page);});
    const dpt=page.querySelector(".dp-toggle");
    if(dpt)dpt.addEventListener("change",()=>{const ht=page.querySelector(".hontable");
      if(ht)ht.innerHTML=honestyTable(r,dpt.checked?1:0);});},0);
  page.querySelectorAll(".condvis-cb").forEach(cb=>
    cb.addEventListener("change",()=>{condVis[r.key][cb.value]=cb.checked;
      // the first still-checked condition drives the per-condition charts below
      const firstOn=conds.find(c=>condVis[r.key][c]);
      if(firstOn)state[r.key]=firstOn;
      renderChart(r,page);renderCategoryChart(r,page);renderDoseCurves(r,page);
      renderDoseResponse(r,page);renderVariation(r,page);renderProto(r,page);}));
  // model visibility is toggled by clicking the swatches in the sticky .modelsel legend
  // (see fillModelLegend/toggleModel) — no separate checkbox row anymore.
  return page;
}

/* per-eval range chart: one row per model, a coloured bar spanning the metric's
   gentlest->harshest value across perturbations, with a dot at the mean. The bar
   length IS the robustness story — wider = the eval result depends more on phrasing. */
function overviewChart(r,color){
  const wrap=document.createElement("div");wrap.className="ovchart";
  const rows=modelsOf(r).map(m=>{
    const vs=r.records.filter(d=>d.model===m&&d.metric_mean!=null).map(d=>d.metric_mean);
    return vs.length?{m:m,min:Math.min(...vs),max:Math.max(...vs),mean:mean(vs)}:null;
  }).filter(Boolean);
  if(!rows.length){wrap.innerHTML='<p class="empty">No results yet — run this eval, then regenerate.</p>';
    return wrap;}
  const rowH=40, top=8, bottom=20, W=320, left=8, right=42;
  const H=top+rows.length*rowH+bottom, x0=left, x1=W-right, axisY=top+rows.length*rowH;
  const sx=v=>x0+(x1-x0)*Math.max(0,Math.min(100,v))/100;
  const svg=el("svg",{width:"100%",viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMid meet"});
  [0,50,100].forEach(v=>{const x=sx(v);
    svg.appendChild(el("line",{x1:x,y1:top,x2:x,y2:axisY,stroke:"#232836","stroke-dasharray":"2 4"}));
    txt(svg,x,axisY+13,v+"%","middle","#6b7280",9);});
  rows.forEach((row,i)=>{
    const yl=top+i*rowH+12, yt=top+i*rowH+27;
    txt(svg,x0,yl,row.m,"start","#cfd3dd",11.5);
    svg.appendChild(el("line",{x1:x0,y1:yt,x2:x1,y2:yt,stroke:"#2b3040","stroke-width":3,"stroke-linecap":"round"}));
    svg.appendChild(el("line",{x1:sx(row.min),y1:yt,x2:sx(row.max),y2:yt,stroke:color,
      "stroke-width":6,"stroke-linecap":"round","stroke-opacity":0.5}));
    svg.appendChild(el("circle",{cx:sx(row.mean),cy:yt,r:4.5,fill:color}));
    txt(svg,x1+6,yt+4,Math.round(row.mean)+"%","start","#9aa3b2",10.5);
  });
  wrap.appendChild(svg);return wrap;
}

/* ---------- robustness vs capability (ECI) ---------- */
/* prompt-variation effect for one (eval, model): mean |metric - control| over EVERY
   perturbed cell (all dimensions x doses), pooled across conditions. Directionless,
   in the eval's own metric units (0-100). */
function effectFor(r,m){
  const conds=r.condition_order.filter(c=>r.records.some(d=>d.condition===c));
  const diffs=[];
  conds.forEach(c=>{
    const ctl=stat(pooledRuns(r,c,m,d=>d.tier===-1)).mean;
    if(ctl==null)return;
    r.records.forEach(d=>{
      if(d.condition===c&&d.model===m&&d.tier!==-1&&d.metric_mean!=null)
        diffs.push(Math.abs(d.metric_mean-ctl));
    });
  });
  return diffs.length?mean(diffs):null;
}
function pearson(xs,ys){const n=xs.length;if(n<2)return null;
  const mx=mean(xs),my=mean(ys);let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  return (sxx>0&&syy>0)?sxy/Math.sqrt(sxx*syy):null;}

function buildRobustness(){
  const page=document.createElement("div");page.className="page";page.id="page-__robust";
  const allM=new Set();REPORTS.forEach(r=>allModelsOf(r).forEach(m=>allM.add(m)));
  const models=[...allM].filter(m=>MODEL_ECI[m]!=null);
  page.innerHTML="<h2>Robustness vs capability</h2><p class=sub>Prompt-variation effect "+
    "(y: mean |&Delta;| of the metric vs the control prompt, in metric points) against "+
    "capability (x: Epoch Capabilities Index). Small coloured dots are per eval; the large "+
    "dot is the eval-balanced average per model. Caveats: a model pinned near 0/100% on an "+
    "eval looks artificially robust (floor/ceiling), and per-model n is small.</p>";
  if(models.length<2){const p=document.createElement("p");p.className="empty";
    p.textContent="Need at least 2 models with an ECI in this run set.";page.appendChild(p);return page;}
  const perEval={}, avg=[];
  models.forEach(m=>{const es=[];
    REPORTS.forEach(r=>{const e=effectFor(r,m);
      if(e!=null){es.push(e);(perEval[r.key]=perEval[r.key]||[]).push({m:m,x:MODEL_ECI[m],y:e});}});
    if(es.length)avg.push({m:m,x:MODEL_ECI[m],y:mean(es)});});
  if(avg.length<2){const p=document.createElement("p");p.className="empty";
    p.textContent="Not enough data to plot.";page.appendChild(p);return page;}
  const W=900,H=560,L=66,Rm=200,T=24,B=58;
  let allY=avg.map(p=>p.y);REPORTS.forEach(r=>(perEval[r.key]||[]).forEach(p=>allY.push(p.y)));
  const xsAll=avg.map(p=>p.x);
  const xmin=Math.min(...xsAll)-4,xmax=Math.max(...xsAll)+4;
  const ymax=Math.max(1,...allY)*1.12,ymin=0;
  const PX=x=>L+(x-xmin)/(xmax-xmin)*(W-L-Rm);
  const PY=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);
  const svg=el("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",style:"max-width:1000px"});
  const ystep=ymax<=5?1:ymax<=12?2:ymax<=30?5:10;
  for(let y=0;y<=ymax;y+=ystep){const py=PY(y);
    svg.appendChild(el("line",{x1:L,y1:py,x2:W-Rm,y2:py,stroke:"#222838","stroke-width":1}));
    txt(svg,L-8,py+4,y.toFixed(0),"end","#8a93a6",12);}
  const xstep=(xmax-xmin)<=22?5:10;
  for(let x=Math.ceil(xmin/xstep)*xstep;x<=xmax;x+=xstep){const px=PX(x);
    svg.appendChild(el("line",{x1:px,y1:T,x2:px,y2:H-B,stroke:"#1b2130","stroke-width":1}));
    txt(svg,px,H-B+18,x.toFixed(0),"middle","#8a93a6",12);}
  txt(svg,(L+(W-Rm))/2,H-12,"Epoch Capabilities Index (ECI) →","middle","#c7ccd6",13);
  txt(svg,18,(T+(H-B))/2,"prompt-variation effect  (mean |Δ| vs control)","middle","#c7ccd6",13,-90);
  REPORTS.forEach(r=>{const col=evalColor(r.key);
    (perEval[r.key]||[]).forEach(p=>svg.appendChild(
      el("circle",{cx:PX(p.x),cy:PY(p.y),r:3.5,fill:col,"fill-opacity":0.5})));});
  const xs=avg.map(p=>p.x),ys=avg.map(p=>p.y),pr=pearson(xs,ys);
  if(pr!=null){const mx=mean(xs),my=mean(ys);let sxy=0,sxx=0;
    for(let i=0;i<xs.length;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)*(xs[i]-mx);}
    const slope=sxx>0?sxy/sxx:0,b=my-slope*mx;
    const cy1=Math.max(ymin,Math.min(ymax,slope*xmin+b)),cy2=Math.max(ymin,Math.min(ymax,slope*xmax+b));
    svg.appendChild(el("line",{x1:PX(xmin),y1:PY(cy1),x2:PX(xmax),y2:PY(cy2),
      stroke:"#9aa3b2","stroke-width":1.5,"stroke-dasharray":"6 4"}));
    txt(svg,W-Rm-6,T+14,"Pearson r = "+pr.toFixed(2),"end","#c7ccd6",13);}
  avg.forEach(p=>{
    svg.appendChild(el("circle",{cx:PX(p.x),cy:PY(p.y),r:6,fill:"#e6e8ee",stroke:"#0e1116","stroke-width":1.5}));
    txt(svg,PX(p.x)+10,PY(p.y)+4,p.m+" ("+p.y.toFixed(1)+")","start","#c7ccd6",11);});
  let ly=T+8;txt(svg,W-Rm+16,ly,"per eval:","start","#8a93a6",12);ly+=18;
  REPORTS.forEach(r=>{const col=evalColor(r.key);
    svg.appendChild(el("circle",{cx:W-Rm+22,cy:ly-4,r:4,fill:col,"fill-opacity":0.6}));
    txt(svg,W-Rm+32,ly,r.title,"start","#c7ccd6",11.5);ly+=17;});
  ly+=6;
  svg.appendChild(el("circle",{cx:W-Rm+22,cy:ly-4,r:5,fill:"#e6e8ee",stroke:"#0e1116","stroke-width":1.3}));
  txt(svg,W-Rm+32,ly,"model average","start","#c7ccd6",11.5);
  const box=document.createElement("div");box.style.margin="10px 0";box.appendChild(svg);
  page.appendChild(box);
  return page;
}

/* Sticky-header context swap: above the per-model section the header shows the model

function fmtRuns(snap){return (snap.runs&&snap.runs.length)?snap.runs.join(" + "):"all runs";}
function renderSnapshot(i){

    const sum=rs.length?(" &middot; "+fmtTok(ti+to)+" tokens &middot; "+(partial?"~":"")+

function buildSnapTabs(){

/* The snapshot data lives in a gzipped sidecar (DATA_URL), fetched + inflated here so
   the HTML itself stays tiny. DecompressionStream handles the gzip; we read the raw
   bytes and fall back to plain JSON in case a CDN already decoded the .gz transparently. */
async function loadSnapshots(){
  const res=await fetch(DATA_URL,{cache:"no-cache"});
  if(!res.ok)throw new Error("HTTP "+res.status+" fetching "+DATA_URL);
  const buf=await res.arrayBuffer();
  try{
    const stream=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }catch(e){
    return JSON.parse(new TextDecoder().decode(buf));   // already-inflated fallback
  }
}
(async function boot(){
  try{
    SNAPSHOTS=await loadSnapshots();
  }catch(e){
    const p=document.getElementById("pages");
    if(p)p.innerHTML='<p style="padding:2em;color:#b00">Failed to load report data ('+
      (e&&e.message||e)+'). The page must be served over http(s) — open it via a web '+
      'server, not a file:// path.</p>';
    return;
  }
  buildSnapTabs();
  renderSnapshot(SNAPSHOTS.length?SNAPSHOTS.length-1:0);   // show the most recent snapshot
  buildGotoBox();
  window.addEventListener("scroll",updateStickyMode,{passive:true});
  window.addEventListener("resize",updateStickyMode,{passive:true});
  setTimeout(updateStickyMode,0);   // initial state once the active page is laid out
  if(location.hash&&location.hash.indexOf("ex=")>=0)setTimeout(()=>rfGoTo(location.hash),80);
})();
</script>
